    <style>
        /* ===== 页面 Header ===== */
        .page-header {
            position: relative;
            z-index: 1;
            min-height: 45vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 150px 50px 80px;
        }

        .page-header .header-badge {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid var(--gray-500);
            color: var(--gray-300);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            animation: fadeInDown 1s ease;
        }

        .page-header .header-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 10px;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease 0.2s both;
        }

        .page-header .header-title .stroke-text {
            -webkit-text-stroke: 2px var(--white);
            color: transparent;
        }

        .page-header .header-title .fill-text {
            background: linear-gradient(135deg, var(--white) 0%, var(--gray-400) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header .header-subtitle {
            font-size: 16px;
            color: var(--gray-400);
            letter-spacing: 5px;
            animation: fadeInUp 1s ease 0.4s both;
        }

        /* ===== 导航栏返回主页 ===== */
        .nav-back-link {
            color: var(--gray-400);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-back-link:hover {
            color: var(--white);
        }

        .nav-back-link .arrow {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .nav-back-link:hover .arrow {
            transform: translateX(-5px);
        }

        /* ===== 动态时间线 ===== */
        .timeline-section {
            position: relative;
            z-index: 1;
            padding: 0 50px 120px;
        }

        .timeline {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--gray-600);
        }

        .timeline-item {
            padding-left: 60px;
            position: relative;
            margin-bottom: 50px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 8px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--black);
        }

        .timeline-date {
            font-size: 12px;
            color: var(--gray-400);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .timeline-item h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .timeline-item p {
            color: var(--gray-400);
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .timeline-item .update-meta {
            font-size: 12px;
            color: var(--gray-500);
            letter-spacing: 1px;
            display: flex;
            gap: 15px;
        }

        .timeline-item .update-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .page-header {
                padding: 120px 25px 60px;
            }

            .page-header .header-title {
                font-size: 34px;
                letter-spacing: 4px;
            }

            .timeline-section {
                padding: 0 25px 80px;
            }

            .nav-back-link {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .page-header .header-title {
                font-size: 26px;
                letter-spacing: 2px;
            }

            .page-header .header-title .stroke-text {
                -webkit-text-stroke: 1px var(--white);
            }
        }

        /* ===== 移动端：时间轴占据左侧，补右侧安全区平衡视觉重心 ===== */
        @media (max-width: 768px) {
            .timeline-section { padding: 0 20px 80px 25px; }
            .timeline::before { left: 7px; }
            .timeline-item { padding-left: 30px; }
            .timeline-item::before { left: 1px; }
        }
    </style>
</head>
