<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../icon/DX_Logo_white.png" type="image/png">
    <title id="pageTitle">游戏详情 | DoubleX GameStudio</title>
    <meta name="description" id="pageDesc" content="DoubleX GameStudio 游戏详情页面">
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        /* ===== 导航栏返回主页 ===== */
        .nav-back-link {
            color: var(--gray-400);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-back-link:hover {
            color: var(--white);
        }

        .nav-back-link .arrow {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .nav-back-link:hover .arrow {
            transform: translateX(-5px);
        }

        /* ===== Hero 横幅 ===== */
        .detail-hero {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 55vh;
            min-height: 400px;
            overflow: hidden;
            margin-bottom: 60px;
        }

        .detail-hero .hero-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: var(--gray-800);
        }

        .detail-hero .hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                var(--black) 0%,
                rgba(0,0,0,0.6) 30%,
                rgba(0,0,0,0.2) 60%,
                transparent 100%
            );
        }

        .detail-hero .hero-info {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            padding: 0 80px;
            z-index: 2;
        }

        .detail-hero .hero-info .game-badge {
            display: inline-block;
            padding: 6px 16px;
            border: 1px solid var(--gray-500);
            color: var(--gray-300);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.4);
        }

        .detail-hero .hero-info h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 0;
            text-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        .detail-hero .hero-info .subtitle {
            font-size: 16px;
            color: var(--gray-400);
            letter-spacing: 3px;
        }

        /* Hero 操作按钮 — 与 subtitle 同行，贴右，底部对齐 */
        .hero-title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .hero-subtitle-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hero-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border: 1.5px solid var(--white);
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.35s ease;
            background: transparent;
            white-space: nowrap;
        }

        .hero-action-btn:hover {
            background: var(--white);
            color: var(--black);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            transform: translateY(-4px);
        }

        .hero-action-btn.disabled {
            border-color: var(--gray-600);
            color: var(--gray-500);
            cursor: default;
            pointer-events: none;
        }

        .hero-action-btn.disabled:hover {
            background: transparent;
            color: var(--gray-500);
            box-shadow: none;
        }

        /* ===== 内容区域 ===== */
        .detail-content {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 50px 100px;
        }

        /* 信息网格 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 80px;
            align-items: start;
        }

        .info-left h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 15px;
        }

        .info-left h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 2px;
            background: var(--white);
        }

        .info-left p {
            color: var(--gray-300);
            line-height: 1.9;
            font-size: 15px;
            margin-bottom: 18px;
        }

        /* 详情元数据 — padding-top 使 meta-list 首行与左侧正文首行对齐 */
        .reveal-right {
            padding-top: 40px;
        }

        .meta-list {
            list-style: none;
            padding: 30px;
            border: 1px solid var(--gray-700);
            background: var(--gray-800);
        }

        .meta-list li {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--gray-700);
            font-size: 14px;
        }

        .meta-list li:last-child {
            border-bottom: none;
        }

        .meta-list .meta-label {
            color: var(--gray-400);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 12px;
        }

        .meta-list .meta-value {
            color: var(--gray-200);
            font-weight: 500;
            text-align: right;
        }

        /* 特色列表 */
        .features-section {
            margin-bottom: 80px;
        }

        .features-section h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        .features-section h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 2px;
            background: var(--white);
            margin: 15px auto 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .feature-card {
            padding: 30px;
            border: 1px solid var(--gray-700);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--white);
            transition: height 0.4s ease;
        }

        .feature-card:hover {
            border-color: var(--gray-400);
            transform: translateY(-4px);
        }

        .feature-card:hover::before {
            height: 100%;
        }

        .feature-card .feature-icon {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .feature-card h3 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .feature-card p {
            color: var(--gray-400);
            font-size: 13px;
            line-height: 1.7;
        }

        /* 截图画廊 */
        .screenshots-section {
            margin-bottom: 80px;
        }

        .screenshots-section h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        .screenshots-section h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 2px;
            background: var(--white);
            margin: 15px auto 0;
        }

        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .screenshot-item {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--gray-700);
            aspect-ratio: 16 / 9;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .screenshot-item:hover {
            border-color: var(--gray-400);
            transform: translateY(-3px);
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            background: var(--gray-800);
        }

        .screenshot-item:hover img {
            transform: scale(1.05);
        }

        /* CTA 区域 */
        .cta-section {
            text-align: center;
            padding: 60px 0;
            border-top: 1px solid var(--gray-700);
            border-bottom: 1px solid var(--gray-700);
        }

        .cta-section p {
            color: var(--gray-400);
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--white);
            color: var(--black);
            border: 2px solid var(--white);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--white);
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            margin-left: 15px;
        }

        .btn-outline:hover {
            background: var(--white);
            color: var(--black);
        }

        /* 数据加载前隐藏动态内容防止闪烁 */
        .detail-content .info-grid,
        .detail-content .features-section,
        .detail-content .screenshots-section,
        .detail-content .cta-section {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .detail-content.loaded .info-grid,
        .detail-content.loaded .features-section,
        .detail-content.loaded .screenshots-section,
        .detail-content.loaded .cta-section {
            opacity: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .detail-hero .hero-info {
                padding: 0 40px;
            }
            .detail-hero .hero-info h1 {
                font-size: 44px;
                letter-spacing: 5px;
            }
            .info-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .features-grid {
                grid-template-columns: 1fr;
            }
            .screenshots-grid {
                grid-template-columns: 1fr;
            }
            .nav-back-link {
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            .detail-content {
                padding: 0 25px 80px;
            }
            .detail-hero {
                height: 40vh;
                min-height: 300px;
            }
            .detail-hero .hero-info {
                padding: 0 25px;
                bottom: 30px;
            }
            .detail-hero .hero-info h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }
            .nav-back-link {
                font-size: 11px;
            }
            .cta-section .btn-outline {
                margin-left: 0;
                margin-top: 15px;
            }
        }

        @media (max-width: 480px) {
            .detail-hero .hero-info h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }
            .detail-hero .hero-info .subtitle {
                font-size: 13px;
            }
            .info-left h2 {
                font-size: 22px;
            }
        }
    </style>
    <!-- 动态数据加载前先根据 URL 参数设置 meta 信息 -->
    <script>
        (function() {
            var gameKey = new URLSearchParams(window.location.search).get('game') || 'geometry';
            var titleMap = { geometry: '几何 - 像素科幻弹幕射击', fishfarm: '养鱼大亨 - 放置养成鱼类收集' };
            var descMap = { geometry: '《几何》极简几何美学×极致弹幕挑战 — DoubleX GameStudio', fishfarm: '《养鱼大亨》鱼类收集养成放置模拟游戏 — DoubleX GameStudio' };
            document.title = (titleMap[gameKey] || '几何') + ' | DoubleX GameStudio';
            var desc = document.getElementById('pageDesc');
            if (desc) desc.content = descMap[gameKey] || 'DoubleX GameStudio 游戏详情页面';
        })();
    </script>
    <!-- 游戏数据 -->
    <script src="games-data.js"></script>
</head>
<body>

    <!-- ===== 自定义光标 ===== -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- ===== 粒子背景 Canvas ===== -->
    <canvas id="particle-canvas"></canvas>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar" id="navbar">
        <a href="../index.html" class="nav-back-link">
            <span class="arrow">&#9664;</span> 返回主页
        </a>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html" class="gray-link">首页</a></li>
            <li><a href="../index.html#about" class="gray-link">关于</a></li>
            <li><a href="../index.html#projects" class="gray-link">作品</a></li>
            <li><a href="../index.html#team" class="gray-link">团队</a></li>
            <li><a href="../index.html#contact" class="gray-link">联系</a></li>
        </ul>
        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- ===== Hero 封面横幅 ===== -->
    <section class="detail-hero" id="gameHero">
        <img class="hero-cover" src="images/art/GEOMETRY/《几何》宣传图_1.png" alt="" id="heroCover">
        <div class="hero-gradient"></div>
        <div class="hero-info">
            <span class="game-badge" id="gameBadge">✦ 弹幕 · 几何</span>
            <div class="hero-title-row">
                <h1 id="gameTitle">几何</h1>
            </div>
            <div class="hero-subtitle-row">
                <p class="subtitle" id="gameSubtitle">极简几何美学 × 极致弹幕挑战</p>
                <a class="hero-action-btn" id="heroActionBtn" href="javascript:;" target="_blank" rel="noopener">观看视频</a>
            </div>
        </div>
    </section>

    <!-- ===== 内容区域（动态渲染） ===== -->
    <div class="detail-content" id="detailContent">
        <!-- 内容完全由 JS 动态生成 -->
    </div>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <div class="footer-links">
            <a href="../index.html">首页</a>
            <a href="../index.html#about">关于</a>
            <a href="../index.html#projects">作品</a>
            <a href="../index.html#team">团队</a>
            <a href="../index.html#contact">联系</a>
        </div>
        <p>&copy; 2026 DoubleX GameStudio. All rights reserved. | 用热爱创造游戏</p>
    </footer>

    <!-- ===== 回到顶部按钮 ===== -->
    <button class="back-to-top" id="backToTop" title="回到顶部">&#9650;</button>

    <!-- ===== 公共脚本 ===== -->
    <script src="../assets/common.js"></script>

    <!-- ===== 页面独有脚本 ===== -->
    <script>
        // ===================================================================
        // 游戏详情 - 动态渲染
        // ===================================================================
        (function() {
            const gameKey = new URLSearchParams(window.location.search).get('game') || 'geometry';
            const data = GAME_DATA[gameKey];
            if (!data) {
                document.getElementById('detailContent').innerHTML = '<div style="text-align:center;padding:100px 0;color:var(--gray-400)"><h2>游戏数据未找到</h2><p style="margin-top:20px">请返回作品页面选择游戏。</p></div>';
                return;
            }

            // 更新 Hero
            document.getElementById('heroCover').src = data.cover;
            document.getElementById('heroCover').alt = data.title + '封面';
            document.getElementById('gameBadge').textContent = data.badge;
            document.getElementById('gameTitle').textContent = data.title;
            document.getElementById('gameSubtitle').textContent = data.subtitle;

            // Hero 右侧操作按钮
            const heroBtn = document.getElementById('heroActionBtn');
            if (data.action) {
                if (data.action.type === 'coming') {
                    heroBtn.classList.add('disabled');
                    heroBtn.href = 'javascript:;';
                    heroBtn.textContent = data.action.text || '敬请期待';
                } else {
                    heroBtn.classList.remove('disabled');
                    heroBtn.href = data.action.url || 'javascript:;';
                    heroBtn.target = data.action.type === 'play' ? '_self' : '_blank';
                    heroBtn.rel = data.action.type === 'play' ? '' : 'noopener';
                    heroBtn.textContent = data.action.text || '了解更多';
                }
            }

            // 构建内容
            const content = document.getElementById('detailContent');

            // 信息网格
            let metaHTML = '';
            Object.entries(data.meta).forEach(([label, value]) => {
                metaHTML += '<li><span class="meta-label">' + label + '</span><span class="meta-value">' + value + '</span></li>';
            });

            const infoGrid = document.createElement('div');
            infoGrid.className = 'info-grid';
            infoGrid.innerHTML = `
                <div class="info-left reveal-left">
                    <h2>关于游戏</h2>
                    <p>${data.desc}</p>
                    <p>${data.desc2}</p>
                    <p>${data.desc3}</p>
                </div>
                <div class="reveal-right">
                    <ul class="meta-list">${metaHTML}</ul>
                </div>
            `;
            content.appendChild(infoGrid);

            // 游戏特色
            if (data.features && data.features.length) {
                const featuresSection = document.createElement('div');
                featuresSection.className = 'features-section';
                let featuresHTML = '<h2 class="reveal">游戏特色</h2><div class="features-grid">';
                data.features.forEach((f, i) => {
                    featuresHTML += '<div class="feature-card reveal" style="transition-delay: ' + (0.1 * (i + 1)) + 's;">'
                        + '<div class="feature-icon">' + f.icon + '</div>'
                        + '<h3>' + f.title + '</h3>'
                        + '<p>' + f.desc + '</p>'
                        + '</div>';
                });
                featuresHTML += '</div>';
                featuresSection.innerHTML = featuresHTML;
                content.appendChild(featuresSection);
            }

            // 游戏截图
            if (data.screenshots && data.screenshots.length) {
                const ssSection = document.createElement('div');
                ssSection.className = 'screenshots-section';
                let ssHTML = '<h2 class="reveal">游戏截图</h2><div class="screenshots-grid">';
                data.screenshots.forEach((ss, i) => {
                    ssHTML += '<div class="screenshot-item reveal" style="transition-delay: ' + (0.1 * (i + 1)) + 's;">'
                        + '<img src="' + ss + '" alt="' + data.title + '截图' + (i + 1) + '">'
                        + '</div>';
                });
                ssHTML += '</div>';
                ssSection.innerHTML = ssHTML;
                content.appendChild(ssSection);
            }

            // CTA 区域 — 从 data.action 获取主按钮内容
            const ctaSection = document.createElement('div');
            ctaSection.className = 'cta-section reveal';
            let ctaHTML = '<p>' + data.tagline + '</p>';
            if (data.action && data.action.type !== 'coming') {
                const isExternal = data.action.type === 'video';
                ctaHTML += '<a href="' + data.action.url + '" class="btn btn-primary" ' + (isExternal ? 'target="_blank" rel="noopener"' : '') + '>' + data.action.text + '</a>';
            }
            ctaHTML += '<a href="index.html" class="btn btn-outline">浏览画廊</a>';
            ctaSection.innerHTML = ctaHTML;
            content.appendChild(ctaSection);

            // 标记加载完成
            content.classList.add('loaded');
        })();
    </script>

</body>
</html>
