    <style>
        body { overflow: hidden; height: 100vh; cursor: auto; }
        html,body{width:100%;height:100%}

        /* 模糊遮罩 — 背景层（覆盖 canvas + glow） */
        .blur-overlay{position:fixed;inset:0;z-index:2;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);background:rgba(0,0,0,0.1);opacity:0;pointer-events:none;transition:opacity .4s}
        .blur-overlay.on{opacity:1}
        /* 模糊遮罩 — UI层（覆盖 header + footer + hint） */
        .ui-blur{position:fixed;inset:0;z-index:99;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);background:rgba(0,0,0,0.1);opacity:0;pointer-events:none;transition:opacity .4s}
        .ui-blur.on{opacity:1}

        /* 导航 */
        .navbar{position:fixed;top:0;left:0;width:100%;padding:18px 50px;z-index:30;display:flex;justify-content:space-between;align-items:center}
        .navbar a{color:var(--gray-400);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:1px;text-transform:uppercase;transition:all .3s;display:flex;align-items:center;gap:8px}
        .navbar a:hover{color:var(--white)}
        .navbar a .ar{font-size:16px;transition:.3s}
        .navbar a:hover .ar{transform:translateX(-5px)}

        .nav-links{display:flex;list-style:none;gap:30px}
        .nav-links a{color:var(--gray-300);font-size:13px;padding:5px 0;position:relative}
        .nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--white);transition:width .3s}
        .nav-links a:hover{color:var(--white)}
        .nav-links a:hover::after{width:100%}
        .menu-toggle{display:none;flex-direction:column;cursor:pointer;gap:6px}
        .menu-toggle span{width:28px;height:2px;background:var(--white);transition:all .3s}
        .menu-toggle.active span:nth-child(1){transform:rotate(45deg)translate(6px,6px)}
        .menu-toggle.active span:nth-child(2){opacity:0}
        .menu-toggle.active span:nth-child(3){transform:rotate(-45deg)translate(6px,-6px)}

        /* 背光 */
        .glow{position:fixed;z-index:0;left:50%;top:50%;width:500px;height:500px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04) 0%,transparent 65%);pointer-events:none;transition:opacity .4s}
        .glow.hide{opacity:0}

        /* ===== 页面主标题 ===== */
        .page-header {
            position: fixed; top: 80px; left: 0; width: 100%;
            z-index: 5; text-align: center; pointer-events: none;
            animation: fadeInDown 1s ease;
        }
        .page-header .header-badge {
            display: inline-block; padding: 8px 20px;
            border: 1px solid var(--gray-500); color: var(--gray-300);
            font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
            margin-bottom: 15px;
        }
        .page-header .header-title {
            font-size: 64px; font-weight: 900; letter-spacing: 10px;
            text-transform: uppercase; line-height: 1.1; margin-bottom: 10px;
            animation: fadeInUp 1s ease 0.2s both;
        }
        .page-header .header-title .stroke-text {
            -webkit-text-stroke: 2px var(--white); color: transparent;
        }
        .page-header .header-title .fill-text {
            background: linear-gradient(135deg, var(--white) 0%, var(--gray-400) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header .header-subtitle {
            font-size: 15px; color: var(--gray-400); letter-spacing: 5px;
            animation: fadeInUp 1s ease 0.4s both;
        }

        /* 3D */
        .scene{position:fixed;inset:0;z-index:3;perspective:1800px;display:flex;align-items:center;justify-content:center;transition:transform .4s;pointer-events:none}
        .scene.blur{transform:scale(.88)}
        .stage{position:relative;width:0;height:0;margin:0 auto;transform-style:preserve-3d;transform:rotateX(-15deg)rotateY(0deg);transition:transform .5s cubic-bezier(.25,.8,.25,1);pointer-events:none}

        /* 卡片（尺寸由 JS 动态计算注入）
           卡片只作视觉层，浏览器命中一律关闭：Blink 在 transform-style:preserve-3d 下
           对 3D 变换元素的命中测试不可靠（elementFromPoint 恒返回 .scene），会让点击被
           closest('.card') 丢弃。交互改由下方 posInCard() 的矩阵判定统一负责，
           Blink / Gecko / WebKit 行为因此一致。 */
        .card{position:absolute;border:1.5px solid var(--gray-500);background:var(--gray-800);overflow:hidden;user-select:none;cursor:pointer;pointer-events:none;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.25,.8,.25,1),opacity .4s,border-color .3s,box-shadow .3s}
        .card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
        .card picture{display:block;width:100%;height:100%;pointer-events:none}
        .card .e{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gray-800),var(--gray-700));pointer-events:none}
        .card.highlight{border-color:var(--white);box-shadow:0 0 30px rgba(255,255,255,.25),0 0 60px rgba(255,255,255,.1)}

        /* 展开卡片（全新独立元素，不干扰 stage） */
        .exp-card{position:fixed!important;z-index:200;width:400px;height:400px;left:6%;top:50%;border:1.5px solid var(--white);background:var(--gray-800);overflow:hidden;pointer-events:auto;box-shadow:0 0 24px rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.9);transition:transform .4s ease,opacity .4s ease,box-shadow .4s ease}
        .exp-card img{width:100%;height:100%;object-fit:cover;display:block}
        .exp-card picture{display:block;width:100%;height:100%}
        .exp-card .e{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:100px;background:linear-gradient(135deg,var(--gray-800),var(--gray-700))}
        /* 玻璃高光：两条 45° 倾斜光束（顶部贯穿至右侧），hover 时沿对角线向左下移动 */
        .exp-card::before,
        .exp-card::after{content:'';position:absolute;pointer-events:none;z-index:5;transition:transform .4s ease}
        .exp-card::before{width:280%;height:9%;top:1.5%;left:-35%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.05) 35%,rgba(255,255,255,.20) 48%,rgba(255,255,255,.30) 50%,rgba(255,255,255,.08) 52%,transparent 100%);transform:rotate(45deg)}
        .exp-card::after{width:200%;height:3.5%;top:12%;left:-25%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 35%,rgba(255,255,255,.18) 48%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.06) 52%,transparent 100%);transform:rotate(45deg)}
        .exp-card:hover{box-shadow:0 0 80px rgba(255,255,255,.35),0 20px 60px rgba(0,0,0,.95)}
        .exp-card:hover::before{transform:rotate(45deg) translate(-25px,30px)}
        .exp-card:hover::after{transform:rotate(45deg) translate(-15px,18px)}

        /* 面板 */
        .panel{position:fixed;right:-520px;top:50%;transform:translateY(-50%);width:460px;max-width:38vw;z-index:199;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gray-700);padding:45px 38px;transition:right .4s cubic-bezier(.25,.8,.25,1)}
        .panel.open{right:5%}
        .panel .b{display:inline-block;padding:6px 16px;border:1px solid var(--gray-500);color:var(--gray-300);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:18px}
        .panel h2{font-size:32px;font-weight:900;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px}
        .panel .s{font-size:14px;color:var(--gray-400);letter-spacing:2px;margin-bottom:22px}
        .panel .d{color:var(--gray-300);font-size:14px;line-height:1.8;margin-bottom:28px}
        .panel .a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:1.5px solid var(--white);color:var(--white);font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:.35s}
        .panel .a:hover{background:var(--white);color:var(--black)}
        /* 尚未开放的作品：把「了解更多」渲染成不可点的状态标签，消除"看着能点却点不动"的错位 */
        .panel .a.disabled{border-color:var(--gray-600);color:var(--gray-500);cursor:not-allowed;pointer-events:none;background:transparent}
        .panel .a.disabled:hover{background:transparent;color:var(--gray-500)}

        .hint{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:201;color:var(--gray-500);font-size:12px;letter-spacing:2px;opacity:0;transition:opacity .4s;pointer-events:none}
        .hint.v{opacity:1}

        .footer{position:fixed;bottom:0;left:0;width:100%;z-index:4;text-align:center;padding:20px 50px;border-top:1px solid var(--gray-700)}
        .footer p{color:var(--gray-500);font-size:12px;letter-spacing:1px}

        @media(max-width:1024px){
            .exp-card{width:320px;height:320px;left:3%}
            .panel{width:340px;padding:30px 25px}
            .panel h2{font-size:26px}
        }
        @media(max-width:768px){
            .navbar{padding:15px 25px;background:rgba(0,0,0,.75)}
            .nav-links{display:flex;position:absolute;top:100%;left:0;width:100%;background:rgba(0,0,0,.98);flex-direction:column;padding:30px;gap:25px;border-bottom:1px solid var(--gray-700);visibility:hidden;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s,visibility 0s .3s}
            .nav-links.active{visibility:visible;opacity:1;transform:translateY(0);transition:opacity .3s,transform .3s,visibility 0s 0s}
            .menu-toggle{display:flex}
            .navbar a{font-size:11px}
            .scene{touch-action:none;-webkit-touch-callout:none}
            /* 展开卡片：锚定 top，不随 translateY 偏移 */
            .exp-card{width:56vw;height:56vw;max-width:240px;max-height:240px;left:0;right:0;top:105px;margin:0 auto}
            .exp-card .e{font-size:60px}
            /* 面板改为底部滑出 Sheet */
            .panel{display:block;right:0;left:0;top:auto;bottom:0;width:100%;max-width:100%;transform:translateY(100%);border:1px solid var(--gray-700);overflow-x:hidden;padding:25px 22px 32px;transition:transform .4s cubic-bezier(.25,.8,.25,1)}
            .panel::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;background:var(--gray-600)}
            .panel.open{right:0;transform:translateY(0)}
            .panel h2{font-size:24px}
            .panel .d{font-size:13px}
            .panel .a{display:block;width:fit-content;margin:20px auto 0}
            .hint{display:none}
            .footer{padding:15px 25px}
            .page-header { top: 60px; }
            .page-header .header-title { font-size: 34px; letter-spacing: 4px; }
            .page-header .header-badge { font-size: 10px; padding: 5px 14px; margin-bottom: 8px; }
            .page-header .header-subtitle { font-size: 13px; }
        }
    </style>
</head>

<script src="../assets/common.js"></script>
<script>
(function(){
'use strict';
var D=[
{t:'几何',s:'像素科幻 2D 平台射击',e:'🔺',i:'images/art/GEOMETRY/《几何》宣传图_1.png',w:'images/art/GEOMETRY/《几何》宣传图_1.webp',b:'✦ 像素 · 射击',d:'《几何》是一款以像素风格为美术基础的 2D 平台射击游戏，融合科幻、硬核闯关与 roguelike 元素。选择角色在随机生成的关卡中战斗，探寻「几何」与「自我」的意义。',a:{u:'game-detail.html?game=geometry',t:'了解更多'}},
{t:'养鱼大亨',s:'放置养成 · 鱼类收集',e:'🐟',i:'',b:'✦ 养成 · 模拟',d:'《养鱼大亨》是一款以鱼类收集养成为核心的放置模拟游戏。数十种鱼类从孔雀鱼到远古存在呈阶梯式解锁，构建属于自己的水下生态世界。',a:{u:'game-detail.html?game=fishfarm',t:'了解更多'}},
{t:'螺旋塔',s:'卡通风格 轻度肉鸽 地牢探险',e:'🗡️',i:'',b:'✦ 开发中',d:'一款卡通风格的轻度 Roguelike 地牢探险游戏，随机地图、丰富道具、爽快战斗。目前正在开发中，敬请期待！',a:{u:'javascript:;',t:'敬请期待'}},
{t:'异种',s:'像素风格 动作游戏',e:'☣️',i:'',b:'✦ 开发中',d:'一款像素风格的动作角色扮演游戏，多主角多视角叙事，探索分崩离析世界中的黑暗秘密。目前正在开发中，敬请期待！',a:{u:'javascript:;',t:'敬请期待'}}
];
while(D.length<12){var n=D.length+1;D.push({t:'作品 #'+n,s:'开发中...',e:'❓',i:'',b:'✦ 敬请期待',d:'一个全新的游戏项目正在构思中，未来将带来更多惊喜。敬请关注我们的最新动态！',a:{u:'javascript:;',t:'敬请期待'}});}

var S=document.getElementById('stage'),E=document.getElementById('scene'),G=document.getElementById('glow'),BO=document.getElementById('blurO'),UB=document.getElementById('uiBlur'),P=document.getElementById('panel'),H=document.getElementById('hint'),B=document.getElementById('b'),T=document.getElementById('t'),S2=document.getElementById('s'),D2=document.getElementById('d'),A=document.getElementById('a'),N=12,ST=360/N,ra=0,hl=-1,lc=0,SZ=220,R=430,TPX=60,tx=0,ty=0,tm=0,ex=null,clT=null;

// 动态布局：按视口计算卡片尺寸 / 半径 / 透视 / 背光
function calcLayout(){
 var vw=document.documentElement.clientWidth||window.innerWidth,vh=window.innerHeight;
 SZ=Math.round(Math.min(Math.max(Math.min(vw*0.16,vh*0.22),85),220));
 var mx=(vw/2-8)/2.59;           // 保证转盘最宽处不超出屏幕
 if(SZ>mx)SZ=Math.max(70,Math.floor(mx));
 R=Math.round(SZ*2.09);
 E.style.perspective=Math.round(R*4.5)+'px';
 G.style.width=G.style.height=Math.round(R*1.16)+'px';
}

// 构建卡片
function buildCards(){
 S.innerHTML='';
 _cards=[];                              // 卡片已重建，让 cards() 重新采集
 for(var i=0;i<N;i++){
  var d=D[i],el=document.createElement('div');
  el.className='card';el.dataset.idx=i;
  el.style.width=SZ+'px';el.style.height=SZ+'px';
  el.style.left=(-SZ/2)+'px';el.style.top=(-SZ/2)+'px';
  if(d.i){var m=document.createElement('img');m.src=d.i;m.alt=d.t;m.loading='lazy';m.decoding='async';
   if(d.w){var pc=document.createElement('picture');var sc=document.createElement('source');sc.srcset=d.w;sc.type='image/webp';pc.appendChild(sc);pc.appendChild(m);el.appendChild(pc)}
   else{el.appendChild(m)}}
  else{var e=document.createElement('div');e.className='e';e.style.fontSize=Math.round(SZ*0.33)+'px';e.textContent=d.e;el.appendChild(e)}
  el.style.transform='rotateY('+i*ST+'deg) translateZ('+R+'px)';
  S.appendChild(el);
 }
 rd(false);
}

function gHL(){
 var md=360,idx=0;
 for(var i=0;i<N;i++){
  var net=((i*ST+ra)%360+360)%360,d=Math.abs(net);
  if(d>180)d=360-d;
  if(d<md){md=d;idx=i}
 }
 // 始终返回最接近正面的卡片：原先的 `return md<12?idx:-1` 会让 23.3% 的旋转角
 // 返回 -1，此时所有卡片都不可交互（整盘点不动），属死区缺陷，故去掉该判定。
 return idx;
}

// 卡片列表（缓存，buildCards 时重建）
var _cards=[];
function cards(){if(!_cards.length){_cards=Array.prototype.slice.call(S.querySelectorAll('.card'))}return _cards}

function doHL(cs){
 for(var j=0;j<cs.length;j++){
  var el=cs[j],idx=parseInt(el.dataset.idx),net=((idx*ST+ra)%360+360)%360,deg=Math.min(net,360-net),op=1-(deg/180)*.55,br=1-(deg/180)*.65,isF=(idx===hl);
  el.style.transform='rotateY('+idx*ST+'deg) translateZ('+R+'px)'+(isF?' translateY('+(-Math.round(SZ*0.11))+'px)':'');
  el.style.opacity=op;el.style.filter='brightness('+br+')';
  // 不再切换 pointerEvents：卡片命中已统一交给 decide()/posInCard() 的矩阵判定，
  // 引擎不再参与，也就没有"指针态与高亮态不同步"的窗口
  if(isF)el.classList.add('highlight');else el.classList.remove('highlight');
 }
}

function rd(anim){
 S.style.transition=anim?'transform 0.5s cubic-bezier(0.25,0.8,0.25,1)':'none';
 // ra 有意保持无界累加，请勿在此或别处对它取模：
 // 取模会让 360°→0° 被 CSS transition 渲染成反向旋转，破坏无限转动手感。
 S.style.transform='rotateX(-15deg) rotateY('+ra+'deg)';
 hl=gHL();var cs=S.querySelectorAll('.card');for(var j=0;j<cs.length;j++)cs[j].classList.remove('highlight');
 if(anim){if(window._t)clearTimeout(window._t);window._t=setTimeout(function(){doHL(cs)},130)}else doHL(cs);
}

// 滚轮：直接步进，快速/连续滚动无缝衔接（高亮由 rd 内 130ms 定时器消抖）
// 方向：deltaY>0（向下滚）-> ra+= -ST；deltaY<0（向上滚）-> ra+= +ST
// 注意：滚轮与触控板共用这一段代码，不区分设备。
// 注意：ra 保持无界累加，切勿取模归一到 [0,360)，否则 CSS transition 会把
// 360°→0° 的跳变渲染成反向旋转，破坏"无限转动"。
window.addEventListener('wheel',function(e){
 if(lc)return;
 e.preventDefault();
 ra+=e.deltaY>0?-ST:ST;
 rd(true);
},{passive:false});

// 展开 — 完全不影响 stage 内的卡片
function ex2(idx){
 // 不再用 if(lc)return 拦截：关闭动画期间的点击应当能直接打开新卡片
 if(ex){gen++;if(clT){clearTimeout(clT);clT=null}if(ex.parentNode)ex.remove();ex=null}
 gen++;lc=1;
 var d=D[idx];
 // 创建全新独立展开卡片（初始为缩小+透明状态）
 var el=document.createElement('div');el.className='exp-card';
 var mo=window.innerWidth<=768;
 el.style.transform=mo?'scale(.6)':'translateY(-50%) scale(.6)';
 el.style.opacity='0';
 if(d.i){var im=document.createElement('img');im.src=d.i;im.alt=d.t;
  if(d.w){var ipc=document.createElement('picture');var isc=document.createElement('source');isc.srcset=d.w;isc.type='image/webp';ipc.appendChild(isc);ipc.appendChild(im);el.appendChild(ipc)}
  else{el.appendChild(im)}}
 else{var em=document.createElement('div');em.className='e';em.textContent=d.e;el.appendChild(em)}
 document.body.appendChild(el);ex=el;
 // 卡片本身已不带浏览器命中（CSS pointer-events:none），无需再逐个关闭；
 // "点空白处关闭"由 document 上的 decide() 统一处理
 // 双 rAF 确保初始状态提交后启动过渡，从 scale(.6)/透明平滑放大
 requestAnimationFrame(function(){
  requestAnimationFrame(function(){
   el.style.transition='transform .4s cubic-bezier(.25,.8,.25,1),opacity .4s ease,box-shadow .4s ease';
   el.style.transform=mo?'scale(1)':'translateY(-50%) scale(1)';
   el.style.opacity='1';
  });
 });

 BO.classList.add('on');UB.classList.add('on');E.classList.add('blur');G.classList.add('hide');H.classList.add('v');
 B.textContent=d.b;T.textContent=d.t;S2.textContent=d.s;D2.textContent=d.d;
 if(d.a.u&&d.a.u!=='javascript:;'){A.href=d.a.u;A.target='_self';A.textContent=d.a.t;A.classList.remove('disabled');A.removeAttribute('aria-disabled')}
 else{A.removeAttribute('href');A.removeAttribute('target');A.classList.add('disabled');A.setAttribute('aria-disabled','true');A.textContent=(d.a.t||'敬请期待')+'（开发中）'}
 P.classList.add('open');
}

// 每次展开带一个代次标识：关闭动画进行中若又打开了新卡片，
// 旧的 400ms 计时器回来时只会回收它自己那一片，不会误删新的。
var gen=0;

function cl(){
 if(!ex)return;
 if(clT){clearTimeout(clT);clT=null}
 var dying=ex,n=gen;
 ex=null;
 lc=0;                                   // 立即解锁：原先要等 400ms 才解锁，
                                         // 期间点任何卡片都会被 ex2() 的 if(lc)return 吞掉
 P.classList.remove('open');BO.classList.remove('on');UB.classList.remove('on');E.classList.remove('blur');H.classList.remove('v');G.classList.remove('hide');
 // 从当前状态（含展开过渡中途）平滑过渡到缩小+透明
 dying.style.pointerEvents='none';
 dying.style.transition='transform .4s ease,opacity .4s ease';
 dying.style.transform=(window.innerWidth<=768)?'scale(.5)':'translateY(-50%) scale(.5)';
 dying.style.opacity='0';
 clT=setTimeout(function(){
  clT=null;
  if(dying&&dying.parentNode)dying.remove();
  if(gen===n)rd(false);                  // 期间没有新开卡片才复位高亮
 },400);
}

// ===================================================================
// 交互判定层（与 3D 视觉解耦）
// -------------------------------------------------------------------
// 为什么不用浏览器命中：Blink 在 transform-style:preserve-3d 下对 3D 变换元素的
// hit-test 不可靠 —— 实测 elementFromPoint 在卡片中心恒返回 .scene，真实点击因此
// 被 closest('.card') 丢弃，表现为"卡片点不开"。Firefox 内核正常，所以只在这个
// 内核上复现。这里改为用 CSS 矩阵把屏幕坐标逆变换回卡片本地坐标，
// 透视与各级变换由矩阵自动处理，三个内核走同一套数学，不再有引擎差异。
// ===================================================================

// 卡片是正方形，原点在中心（left/top 均为 -SZ/2），故本地坐标范围为 ±SZ/2
function posInCard(c,x,y){
 var m=c.getScreenCTM&&c.getScreenCTM();
 if(m&&m.a!==undefined){
  try{
   var inv=m.inverse(),p=new DOMPoint(x,y).matrixTransform(inv);
   var h=SZ/2+2;                       // 2px 容差，避免边缘抖动
   if(Math.abs(p.x)<=h&&Math.abs(p.y)<=h)return true;
   return false;
  }catch(e){/* 矩阵不可逆时退回包围盒 */}
 }
 var r=c.getBoundingClientRect();
 return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}

// 返回当前屏幕坐标下命中的卡片索引，未命中返回 -1
function cardAt(x,y){
 var cl=cards(),i,c;
 for(i=0;i<cl.length;i++){c=cl[i];if(c.style.visibility!=='hidden'&&posInCard(c,x,y))return i}
 return -1;
}

var _pt=null;
E.addEventListener('pointerdown',function(e){_pt={x:e.clientX,y:e.clientY}},{passive:true});

// 单一判定入口：先判断点击是否落在面板/展开卡片内，再决定打开还是关闭。
// 顺序很重要 —— 不能靠"事件被面板吃掉所以走不到这里"来推断意图，
// 因为 .panel / .exp-card 的层级与 pointer-events 一旦调整，这个假设就会失效。
function inChrome(x,y){
 var r,i,all;
 // 面板
 r=P.getBoundingClientRect();
 if(r.width&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return true;
 // 展开卡片（可能同时存在多个，逐个判）
 all=document.querySelectorAll('.exp-card');
 for(i=0;i<all.length;i++){
  r=all[i].getBoundingClientRect();
  if(r.width&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return true;
 }
 return false;
}

function decide(x,y){
 if(lc){
  // 展开态：点面板内部或展开卡片内部不关闭，其余一律关闭
  if(inChrome(x,y))return false;
  cl();
  return true;
 }
 var i=cardAt(x,y);
 if(i<0)return false;
 if(i!==hl)return false;               // 只允许正对屏幕的卡片
 ex2(i);
 return true;
}

document.addEventListener('click',function(e){
 if(tm)return;                          // 刚刚滑动过，忽略这次合成点击
 if(_pt&&(Math.abs(e.clientX-_pt.x)>10||Math.abs(e.clientY-_pt.y)>10))return;
 decide(e.clientX,e.clientY);
});

// 键盘可达性：左右/上下切换，回车或空格打开，Esc 关闭
document.addEventListener('keydown',function(e){
 var k=e.key;
 if(k==='Escape'){if(lc)cl();return}
 if(lc)return;
 if(k==='ArrowRight'||k==='ArrowDown'){ra-=ST;rd(true);e.preventDefault()}
 else if(k==='ArrowLeft'||k==='ArrowUp'){ra+=ST;rd(true);e.preventDefault()}
 else if(k==='Enter'||k===' '){if(hl>=0)ex2(hl);e.preventDefault()}
});

// 触控支持：水平滑动旋转。注意必须挂在 document 上 —— .scene 已设 pointer-events:none，
// 触摸事件不会再派发到它，若沿用原来的 E.addEventListener 移动端将完全无法滑动。
// 本页 body 为 overflow:hidden，因此 preventDefault 不会妨碍页面滚动。
document.addEventListener('touchstart',function(e){
 if(lc)return;
 var t=e.touches&&e.touches[0];if(!t)return;
 tx=t.clientX;ty=t.clientY;tm=0;
},{passive:true});
document.addEventListener('touchmove',function(e){
 if(lc)return;
 var t=e.touches&&e.touches[0];if(!t)return;
 var dx=t.clientX-tx,dy=t.clientY-ty;
 if(Math.abs(dx)>10||Math.abs(dy)>10){tm=1;e.preventDefault()}
 if(Math.abs(dx)>=TPX){
  ra+=dx>0?ST:-ST;tx=t.clientX;rd(true);
 }
},{passive:false});
// tm 原先只在 touchstart 归零，手势结束后会一直保持 1，导致部分浏览器吞掉
// 合成点击（首次点击无效）。这里在手指离开/取消时立即归零。
function _tend(){tx=ty=0;tm=0}
document.addEventListener('touchend',_tend,{passive:true});
document.addEventListener('touchcancel',_tend,{passive:true});

// 视口变化（旋转/缩放）时重算布局。
// buildCards() 会清空 #stage 重建 12 张卡；在那之前到重建完成之间，
// 卡片位置处于旧布局，若此刻展开会把卡片放大到错误位置，
// 因此把面板/展开卡片收起（它们的位置依赖视口，同样需要回中）。
var rt;
window.addEventListener('resize',function(){
 clearTimeout(rt);
 rt=setTimeout(function(){
  if(lc)cl();
  calcLayout();
  buildCards();
 },200);
});

// 移动端菜单
var mt=document.getElementById('mt'),nl=document.getElementById('nl');
if(mt&&nl){mt.addEventListener('click',function(){mt.classList.toggle('active');nl.classList.toggle('active')})}

calcLayout();
buildCards();
})();
</script>
